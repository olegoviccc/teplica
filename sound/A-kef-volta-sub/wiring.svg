<text x="60" y="1420" font-size="21" fill="#5b6475">Кабели XLR из КП Пульта: в работе 2 × 2 м (выходы CM82). 6 × 1 м — запас; один уйдёт</text>
<text x="60" y="1448" font-size="21" fill="#5b6475">с LINK канала 1 на IN 3 Volta, если PARALLEL у этой модели связывает каналы только парами.</text>
<text x="60" y="1476" font-size="21" fill="#5b6475">CM82: выходы — Euroblock 3 pin (pin 2 «+», pin 3 «−», pin 1 экран). Стерео с iPad суммируется в моно.</text>
<text x="60" y="1504" font-size="21" fill="#5b6475">Канал 4 Volta — свободен (резерв). Регулятор «ЗАЛ» стоит до Volta: убавляет и KEF, и сабвуфер.</text>
<text x="60" y="1532" font-size="21" fill="#5b6475">Сверить по месту: разъёмы на задней панели Volta (XLR / Speakon) и режим PARALLEL для 4 каналов.</text>
